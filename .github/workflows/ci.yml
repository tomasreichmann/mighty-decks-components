name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm stage:git -- --source-commit ${{ github.sha }}
      - run: pnpm verify:consumer -- --git-stage output/git-package
      - run: pnpm verify:consumer -- --git-stage output/git-package --pnpm-version 10.29.3

  windows-export-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm assets:prepare
      - run: pnpm generate:data
      - run: pnpm exec playwright install chromium
      - run: pnpm generate:png -- --type outcome --id success --layout full
      - run: pnpm pack:runtime
      - run: pnpm test:package
      - run: pnpm stage:git -- --source-commit ${{ github.sha }}
      - run: pnpm verify:consumer -- --git-stage output/git-package
      - run: pnpm verify:consumer -- --git-stage output/git-package --pnpm-version 10.29.3
