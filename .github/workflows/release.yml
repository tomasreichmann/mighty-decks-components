name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Pin package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate:png
      - run: pnpm pack:runtime
      - run: pnpm package:runtime-assets
      - run: pnpm archive:png
      - run: pnpm verify:artifacts
      - run: pnpm verify:browser -- --tarball output/runtime.tgz
      - name: Upload a draft release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/runtime.tgz output/mighty-decks-components-*-runtime-assets.tar.gz output/mighty-decks-components-*-png-*.tar.gz output/release-manifest.json --verify-tag --title "$GITHUB_REF_NAME" --draft
      - name: Detect an already-published bootstrap version
        id: npm-package
        run: |
          if npm view "@mighty-decks/components@${GITHUB_REF_NAME#v}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the validated runtime package
        if: steps.npm-package.outputs.published != 'true'
        run: npm publish output/runtime.tgz --access public
      - name: Publish the immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - run: pnpm verify:release -- --version "${GITHUB_REF_NAME#v}" --repository tomasreichmann/mighty-decks-components
