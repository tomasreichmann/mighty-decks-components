name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Pin package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate:png
      - run: pnpm pack:runtime
      - run: pnpm archive:png
      - run: pnpm verify:artifacts
      - name: Publish the validated runtime package
        run: npm publish output/runtime.tgz --access public
      - name: Create the immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" output/runtime.tgz output/mighty-decks-components-*-png-*.tar.gz output/release-manifest.json --verify-tag --title "$GITHUB_REF_NAME"
      - run: pnpm verify:release -- --version "${GITHUB_REF_NAME#v}" --repository tomasreichmann/mighty-decks-components
