name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (vVERSION) to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mighty-decks-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Validate immutable source tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git tag --points-at HEAD "$TAG")" = "$TAG"
          test "${TAG#v}" != "$TAG"
          node -e 'const p=require("./package.json"); if(process.env.TAG !== `v${p.version}`) process.exit(1)'
      - name: Pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete local release gate
        run: |
          pnpm check:release
      - name: Stage and verify the installable Git package
        run: |
          pnpm stage:git -- --source-commit "$(git rev-parse HEAD)"
          pnpm verify:consumer -- --git-stage output/git-package
      - name: Create or verify immutable distribution ref
        id: distribution
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/publish-git-distribution.mjs --remote "$(git remote get-url origin)" --staged output/git-package --version "${TAG#v}"
      - name: Verify the pushed Git package
        env:
          SHA: ${{ steps.distribution.outputs.sha }}
        run: pnpm verify:consumer -- --git "git+https://github.com/${{ github.repository }}.git#${SHA}"
      - name: Finalize artifacts with distribution provenance
        env:
          GIT_DISTRIBUTION_COMMIT: ${{ steps.distribution.outputs.sha }}
        run: |
          pnpm archive:png
          REQUIRE_GIT_DISTRIBUTION: true pnpm verify:artifacts
      - name: Create a draft source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" output/runtime.tgz output/mighty-decks-components-*-runtime-assets.tar.gz output/mighty-decks-components-*-png-*.tar.gz output/release-manifest.json --title "$TAG" --verify-tag --draft
      - name: Verify draft Git release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:release -- --version "${TAG#v}" --repository "${{ github.repository }}"
      - name: Publish verified source release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
      - name: Verify published Git release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:release -- --version "${TAG#v}" --repository "${{ github.repository }}"
