name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to validate and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Pin package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm check
      - name: Download the locally verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" --json isDraft --jq '.isDraft == true' | grep -x true
          gh release download "${{ inputs.tag }}" --pattern runtime.tgz --pattern release-manifest.json --dir output --clobber
      - name: Detect an already-published bootstrap version
        id: npm-package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if npm view "@mighty-decks/components@${TAG#v}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the validated runtime package
        if: steps.npm-package.outputs.published != 'true'
        run: npm publish output/runtime.tgz --access public
      - name: Publish the immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --draft=false
      - name: Verify the published release
        if: steps.npm-package.outputs.published != 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: pnpm verify:release -- --version "${TAG#v}" --repository tomasreichmann/mighty-decks-components
